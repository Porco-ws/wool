<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>주식 상식 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* 레이아웃: 한 컬럼 모바일 우선, 시작→문제→결과 화면 교체. 타임머신 주식게임과 같은 패밀리 */
:root{
  --bg:#F3F1EB; --surface:#FFFFFF; --ink:#19233B; --ink-sub:#5B6478; --ink-faint:#9AA2B4;
  --navy:#0E1E45; --navy-ink:#FFFFFF;
  --right:#1D7A4F; --right-soft:#E7F3EC; --wrong:#C8362E; --wrong-soft:#FBEAE8;
  --line:#E2DFD6; --gold:#B98A2E;
  --display:'Noto Serif KR',serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1C2030; --ink:#EDEFF5; --ink-sub:#A9B1C4; --ink-faint:#6B7388;
  --navy:#273458; --navy-ink:#FFFFFF;
  --right:#4CC38A; --right-soft:#1E3129; --wrong:#F0605A; --wrong-soft:#3A2426;
  --line:#2E3447; --gold:#D8A94E; color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1C2030; --ink:#EDEFF5; --ink-sub:#A9B1C4; --ink-faint:#6B7388;
  --navy:#273458; --navy-ink:#FFFFFF;
  --right:#4CC38A; --right-soft:#1E3129; --wrong:#F0605A; --wrong-soft:#3A2426;
  --line:#2E3447; --gold:#D8A94E; color-scheme:dark
}
body{background:var(--bg); color:var(--ink); font-family:var(--body); margin:0; padding-inline:16px; padding-block:8px 32px; font-size:17px; line-height:1.55}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.brand{display:flex; align-items:center; gap:8px; justify-content:center; padding-block:10px 0; color:var(--ink-sub); font-size:13px; font-weight:700; letter-spacing:.14em}
h1{font-family:var(--display); font-weight:900; font-size:34px; line-height:1.25; text-align:center; margin:0; text-wrap:balance}
.lede{text-align:center; color:var(--ink-sub); margin:0; font-size:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px}
.rules{display:flex; flex-direction:column; gap:10px; font-size:16px}
.rule{display:flex; gap:10px; align-items:baseline}
.rule .no{flex:none; font-weight:900; color:var(--gold); font-family:var(--display)}
button{font-family:var(--body); cursor:pointer; border:none; border-radius:12px; font-weight:700}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.big{width:100%; padding:18px; font-size:22px}
.primary{background:var(--navy); color:var(--navy-ink)}
.ghost{background:transparent; color:var(--ink-sub); border:1.5px solid var(--line); font-size:16px; padding:12px}
.best{text-align:center; color:var(--ink-sub); font-size:14px; margin:0}
/* 문제 화면 */
.hud{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.hud .qno{font-weight:900; font-size:16px; color:var(--ink-sub); letter-spacing:.06em}
.hud .score{font-weight:900; font-size:20px; font-variant-numeric:tabular-nums}
.meter{height:8px; background:var(--line); border-radius:999px; overflow:hidden}
.meter i{display:block; height:100%; width:0%; background:var(--gold); border-radius:999px; transition:width .3s}
.qcard{display:flex; flex-direction:column; gap:12px}
.tag{align-self:flex-start; background:var(--bg); color:var(--gold); font-weight:900; font-size:13px; letter-spacing:.08em; padding:4px 12px; border-radius:999px; border:1px solid var(--line)}
.qtext{margin:0; font-family:var(--display); font-weight:900; font-size:23px; line-height:1.45; text-wrap:balance}
.opts{display:flex; flex-direction:column; gap:10px}
.opts.ox{flex-direction:row}
.opt{width:100%; text-align:left; background:var(--bg); color:var(--ink); border:2px solid var(--line); padding:15px 16px; font-size:18px; font-weight:700; line-height:1.4}
.opts.ox .opt{text-align:center; font-size:34px; font-weight:900; padding:22px 8px}
.opt .mk{display:inline-block; width:26px; color:var(--gold); font-weight:900}
.opt:disabled{cursor:default; opacity:.55}
.opt.sel-right{background:var(--right-soft); border-color:var(--right); color:var(--ink); opacity:1}
.opt.sel-wrong{background:var(--wrong-soft); border-color:var(--wrong); color:var(--ink); opacity:1}
.fb{display:none; flex-direction:column; gap:8px}
.fb.show{display:flex}
.fb .head{font-size:22px; font-weight:900; text-align:center}
.fb .head.ok{color:var(--right)} .fb .head.no{color:var(--wrong)}
.fb .exp{background:var(--bg); border-radius:10px; padding:12px 14px; font-size:15.5px; color:var(--ink-sub)}
.fb .exp b{color:var(--ink)}
/* 결과 화면 */
.final{text-align:center; display:flex; flex-direction:column; gap:6px}
.final .grade{font-family:var(--display); font-weight:900; font-size:30px}
.final .amount{font-size:40px; font-weight:900; font-variant-numeric:tabular-nums}
.final .note{color:var(--ink-sub); font-size:15px; margin:0}
table{width:100%; border-collapse:collapse; font-size:14.5px}
td{padding:7px 4px; border-bottom:1px solid var(--line)}
td.r{text-align:right; white-space:nowrap; font-weight:900}
.ok{color:var(--right)} .no{color:var(--wrong)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--navy); color:var(--navy-ink); padding:10px 18px; border-radius:999px; font-size:15px; opacity:0; transition:opacity .25s; pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center; color:var(--ink-faint); font-size:12.5px; margin-top:4px}
@media (prefers-reduced-motion: reduce){ .toast,.meter i{transition:none} }
</style>

<div class="wrap">
  <div class="brand">
    <svg width="20" height="20" viewBox="4 4 56 56" aria-hidden="true"><path d="M14 33 A17 17 0 0 1 31 50 M14 22 A28 28 0 0 1 42 50" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"></path><path d="M14 11 A39 39 0 0 1 53 50" fill="none" stroke="#E0352B" stroke-width="6" stroke-linecap="round"></path><path d="M14 44 A6 6 0 0 1 20 50" fill="none" stroke="#E0352B" stroke-width="6" stroke-linecap="round"></path></svg>
    FINESIGNAL AI
  </div>

  <section id="start">
    <div class="wrap" style="padding:0">
      <h1>주식 상식 퀴즈</h1>
      <p class="lede">용어부터 증시 역사까지,<br>나의 주식 내공은 몇 단일까요?</p>
      <div class="card rules">
        <div class="rule"><span class="no">一</span><span>한 판에 <b>10문제</b>가 무작위로 나옵니다.</span></div>
        <div class="rule"><span class="no">二</span><span><b>OX</b> 또는 <b>사지선다</b>, 보기만 누르면 됩니다.</span></div>
        <div class="rule"><span class="no">三</span><span>문제마다 <b>친절한 해설</b>이 바로 나옵니다.</span></div>
        <div class="rule"><span class="no">四</span><span>시간 제한은 없습니다. 천천히 푸세요.</span></div>
      </div>
      <button class="big primary" id="startBtn">퀴즈 시작</button>
      <p class="best" id="bestLine" hidden></p>
    </div>
  </section>

  <section id="game" hidden>
    <div class="wrap" style="padding:0">
      <div class="hud">
        <span class="qno" id="qno">제 1 문 / 10</span>
        <span class="score" id="score">0점</span>
      </div>
      <div class="meter"><i id="meterBar"></i></div>
      <div class="card qcard">
        <span class="tag" id="qtag"></span>
        <p class="qtext" id="qtext"></p>
        <div class="opts" id="opts"></div>
      </div>
      <div class="card fb" id="fb">
        <span class="head" id="fbHead"></span>
        <div class="exp" id="fbExp"></div>
        <button class="big primary" id="nextBtn">다음 문제</button>
      </div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="wrap" style="padding:0">
      <div class="card final">
        <span style="color:var(--ink-sub); font-size:15px">나의 점수</span>
        <span class="amount" id="fAmount"></span>
        <span class="grade" id="fGrade"></span>
        <p class="note" id="fNote"></p>
      </div>
      <div class="card" style="padding:12px 16px">
        <table><tbody id="historyBody"></tbody></table>
      </div>
      <button class="big primary" id="againBtn">다시 도전하기</button>
      <button class="big ghost" id="copyBtn">결과 복사하기</button>
    </div>
  </section>

  <p class="foot">본 퀴즈는 학습용 콘텐츠이며, 실제 투자 권유가 아닙니다.<br>© Finesignal AI</p>
</div>
<div class="toast" id="toast">복사되었습니다</div>

<script>

 {t:'기초 용어',ox:true,q:'주식을 한 주라도 사면 그 회사의 주주가 된다.',a:'O',e:'단 한 주를 보유해도 <b>주주</b>입니다. 주주총회 참석과 배당받을 권리가 생깁니다.'},

 {t:'기초 용어',q:'IPO는 무엇을 뜻할까요?',c:['기업이 주식시장에 처음 상장하는 것','회사가 문을 닫는 것','주식을 합치는 것','배당을 늘리는 것'],a:0,e:'IPO는 <b>기업공개</b>, 즉 회사가 주식을 공모해 처음 시장에 상장하는 일입니다. 이때 청약 열풍이 불곤 하지요.'},
 {t:'제도',q:'"서킷브레이커"란 어떤 제도일까요?',c:['주가 급변 시 거래를 잠시 멈추는 제도','세금을 깎아 주는 제도','배당을 의무화하는 제도','외국인 매수를 막는 제도'],a:0,e:'전기 차단기에서 온 말로, 지수가 급락하면 <b>시장 전체 거래를 일시 중단</b>해 투자자를 진정시키는 제도입니다. 2020년 코로나 폭락 때 연이어 발동됐습니다.'},

 {t:'투자 격언',ox:true,q:'"황소장(불마켓)"은 주가가 오르는 상승장을 뜻한다.',a:'O',e:'뿔을 치켜올리는 황소는 <b>상승장</b>, 발톱으로 내리찍는 곰은 <b>하락장</b>을 상징합니다.'},
 {t:'경제 상식',ox:true,q:'일반적으로 금리가 오르면 주식시장에는 부담이 된다.',a:'O',e:'금리가 오르면 예금·채권의 매력이 커지고 기업의 이자 부담도 늘어, 보통 주식시장에는 <b>하락 요인</b>으로 작용합니다. 물론 늘 그런 것은 아닙니다.'},
 {t:'경제 상식',q:'다음 중 미국 증시의 대표 지수가 아닌 것은?',c:['닛케이 225','다우존스','나스닥','S&P 500'],a:0,e:'<b>닛케이 225는 일본</b> 도쿄 증시의 지수입니다. 나머지 셋이 미국의 3대 지수이지요.'},
 {t:'경제 상식',q:'삼성전자가 상장되어 있는 시장은?',c:['코스피(유가증권시장)','코스닥','코넥스','나스닥'],a:0,e:'삼성전자는 <b>코스피</b> 상장사이며, 오랫동안 시가총액 1위 자리를 지켜왔습니다.'},
 {t:'경제 상식',q:'"시가총액"이란 무엇일까요?',c:['주가 × 전체 주식 수','회사의 1년 매출','회사가 가진 현금','하루 거래된 금액'],a:0,e:'시가총액은 <b>주가에 발행 주식 수를 곱한 값</b>으로, 시장이 평가하는 회사의 몸값입니다.'},
 {t:'경제 상식',ox:true,q:'환율이 오르면(원화 약세) 수출 기업에는 대체로 유리하다.',a:'O',e:'같은 1달러를 벌어도 원화로 바꾸면 더 많아지니 <b>수출 기업엔 보통 유리</b>합니다. 반대로 수입 물가는 올라갑니다.'},
 {t:'경제 상식',q:'"사이드카"가 발동되면 일어나는 일은?',c:['프로그램 매매가 5분간 정지된다','시장 전체가 하루 쉰다','외국인 거래가 막힌다','세금이 올라간다'],a:0,e:'선물 가격이 급변할 때 <b>프로그램 매매를 5분간 멈추는</b> 제도입니다. 시장 전체를 멈추는 서킷브레이커의 동생 격이지요.'},
 {t:'기초 용어',ox:true,q:'"손절"은 손해를 본 상태에서 주식을 파는 것을 말한다.',a:'O',e:'더 큰 손실을 막으려 <b>손해를 감수하고 파는 것</b>이 손절(손절매)입니다. 반대로 이익을 확정하며 파는 것은 익절이라 합니다.'},
 {t:'증시 역사',q:'2000년 전후 "닷컴 버블"의 중심이 된 국내 시장은?',c:['코스닥','코스피','코넥스','채권시장'],a:0,e:'인터넷 기업이 몰려 있던 <b>코스닥</b>이 1999~2000년 폭등했다가, 거품이 꺼지며 고점 대비 80% 넘게 떨어졌습니다.'},
];
const QN=10;
/* ---------- 유틸 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);
const screens={start:$('start'),game:$('game'),result:$('result')};
function show(n){for(const k in screens)screens[k].hidden=(k!==n); window.scrollTo({top:0});}
function loadBest(){try{return JSON.parse(localStorage.getItem('quiz-best'))||null}catch(e){return null}}
function saveBest(v){try{const b=loadBest(); if(b===null||v>b){localStorage.setItem('quiz-best',JSON.stringify(v)); return true}}catch(e){} return false}
/* ---------- 상태 ---------- */
let state={i:0,score:0,qs:[],history:[],busy:false};
function newGame(){
  const rnd=mulberry32(Date.now()>>>0);
  const qs=shuffle(POOL,rnd).slice(0,QN).map(q=>{
    if(q.ox)return q;
    const order=shuffle(q.c.map((_,k)=>k),rnd);
    return Object.assign({},q,{c:order.map(k=>q.c[k]),a:order.indexOf(q.a)});
  });
  state={i:0,score:0,qs,history:[],busy:false};
  show('game'); render();
}
function render(){
  const q=state.qs[state.i];
  $('qno').textContent='제 '+(state.i+1)+' 문 / '+QN;
  $('score').textContent=state.score+'점';
  $('meterBar').style.width=(state.i/QN*100)+'%';
  $('qtag').textContent=q.t; $('qtext').textContent=q.q;
  const box=$('opts'); box.innerHTML=''; box.className='opts'+(q.ox?' ox':'');
  if(q.ox){ ['O','X'].forEach(v=>{const b=document.createElement('button'); b.className='opt'; b.textContent=v;
      b.style.color=v==='O'?'var(--right)':'var(--wrong)';
      b.addEventListener('click',()=>answer(v)); box.appendChild(b);});
  }else{ q.c.forEach((txt,k)=>{const b=document.createElement('button'); b.className='opt';
      b.innerHTML='<span class="mk">'+['①','②','③','④'][k]+'</span>'+txt;
      b.addEventListener('click',()=>answer(k)); box.appendChild(b);});
  }
  $('fb').classList.remove('show'); state.busy=false;
}
function answer(v){
  if(state.busy)return; state.busy=true;
  const q=state.qs[state.i], ok= q.ox? v===q.a : v===q.a;
  const btns=[...document.querySelectorAll('#opts .opt')];
  btns.forEach((b,k)=>{ b.disabled=true;
    const isAns=q.ox? b.textContent===q.a : k===q.a;
    const isSel=q.ox? b.textContent===v : k===v;
    if(isAns)b.classList.add('sel-right'); else if(isSel)b.classList.add('sel-wrong');
  });
  if(ok)state.score+=10;
  state.history.push({q:q.q,ok});
  $('score').textContent=state.score+'점';
  $('fbHead').textContent= ok?'정답입니다!':'아쉽습니다!';
  $('fbHead').className='head '+(ok?'ok':'no');
  $('fbExp').innerHTML='<b>해설</b><br>'+q.e;
  $('nextBtn').textContent= state.i===QN-1?'최종 결과 보기':'다음 문제';
  $('fb').classList.add('show');
}
function grade(s){
  if(s>=100)return['🏆 주식 박사','만점입니다! 모르는 게 없으시군요. 존경합니다.'];
  if(s>=80)return['🥇 주식 고수','웬만한 전문가 수준입니다. 자신 있게 투자 이야기를 나누셔도 됩니다.'];
  if(s>=60)return['🥈 중수 개미','기본기가 탄탄하십니다. 조금만 더 하면 고수입니다.'];
  if(s>=40)return['🥉 새내기 개미','시작이 반입니다. 해설만 다시 읽어도 실력이 쑥 늡니다.'];
  return['🌱 주식 입문생','괜찮습니다, 누구나 처음은 있지요. 한 판 더 하면 분명 오릅니다!'];
}
function endGame(){
  $('fAmount').textContent=state.score+'점';
  const[g,n]=grade(state.score); $('fGrade').textContent=g;
  const best=saveBest(state.score);
  $('fNote').textContent=n+(best?' (최고 기록 경신!)':'');
  $('historyBody').innerHTML=state.history.map((h,i)=>
    '<tr><td>'+(i+1)+'. '+h.q+'</td><td class="r '+(h.ok?'ok':'no')+'">'+(h.ok?'O':'X')+'</td></tr>').join('');
  show('result');
}
function copyResult(){
  const[g]=grade(state.score);
  const txt='[주식 상식 퀴즈]\n'+state.score+'점 · '+g+'\n'+state.history.map((h,i)=>(i+1)+'. '+(h.ok?'O':'X')).join(' ')+'\n나도 도전 → Finesignal AI';
  const done=()=>{const t=$('toast'); t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));}else fb(txt,done);
  function fb(s,cb){const ta=document.createElement('textarea'); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(e){} ta.remove(); cb();}
}
$('startBtn').addEventListener('click',newGame);
$('againBtn').addEventListener('click',newGame);
$('nextBtn').addEventListener('click',()=>{ if(state.i===QN-1)endGame(); else{state.i++; render();} });
$('copyBtn').addEventListener('click',copyResult);
(function(){const b=loadBest(); if(b!==null){$('bestLine').hidden=false; $('bestLine').textContent='나의 최고 기록: '+b+'점';}})();
/* 핫 리로드 시 상태 보존 */
function boot(d){ if(d&&d.state&&d.screen&&d.state.qs&&d.state.qs.length){ state=d.state;
  if(d.screen==='game'){show('game'); render();} else if(d.screen==='result'){endGame();} } }
if(window.claude&&window.claude.hot){ window.claude.hot.snapshot(()=>({state,screen:Object.keys(screens).find(k=>!screens[k].hidden)}));
  window.claude.hot.ready?window.claude.hot.ready(boot):boot(window.claude.hot.data); }
</script>
